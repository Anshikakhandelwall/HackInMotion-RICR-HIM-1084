name: MediGuard CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build-and-test:
    name: Frontend Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Static Code Linting (Oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Unit & Component Tests
        run: |
          cd frontend
          npm test --if-present

      - name: Verify Production Web Build
        run: |
          cd frontend
          npm run build

  backend-test-suite:
    name: Django Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks & Tests
        env:
          USE_SQLITE: 'true'
          DJANGO_SECRET_KEY: 'ci-secret-key-for-testing-only-change-in-prod'
        run: |
          cd backend
          python manage.py check
          python manage.py test apps.authentication.tests apps.medicines.tests apps.interactions.tests apps.patients.tests apps.ai.tests
